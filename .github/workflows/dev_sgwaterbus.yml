# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - sgwaterbus

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  test:
    # Chay tren ubuntu vi GitHub Actions service container chi dung duoc tren Linux runner.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        # Anh postgis: migration co HasPostgresExtension("postgis") nen postgres thuan se fail.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: dotnet test (unit)
        run: dotnet test tests/Application.UnitTests/Application.UnitTests.csproj -c Release --nologo

      - name: dotnet test (domain)
        run: dotnet test tests/Domain.UnitTests/Domain.UnitTests.csproj -c Release --nologo

      - name: dotnet test (integration)
        env:
          # Moi test tu tao database rieng waterbus_test_* tu connection nay roi xoa khi xong.
          WATERBUS_TEST_DB: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres;"
        run: dotnet test tests/Integration.Tests/Integration.Tests.csproj -c Release --nologo

  build:
    runs-on: windows-latest
    needs: test
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: dotnet publish
        run: dotnet publish src/Web/Web.csproj -c Release -o "${{runner.temp}}/myapp"

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: dotnet publish
        run: dotnet publish src/Web/Web.csproj -c Release -o "${{runner.temp}}/myapp"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F3566BCB2FB44A459E118AA0D18624E3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A2F9FF95D98F48CCA2B13DB78180BE02 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6FCB22824467466FA41BE86EC9F54FBA }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'sgwaterbus'
          slot-name: 'Production'
          package: ${{runner.temp}}/myapp
